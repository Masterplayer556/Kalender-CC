# Hält das kostenlose Supabase-Projekt wach: Supabase pausiert Projekte nach etwa einer Woche
# ohne Zugriffe. Dieser Workflow schickt alle 3 Tage eine kleine Anfrage an die Datenbank.
#
# Ist das Projekt trotzdem pausiert (oder nicht erreichbar), schlägt der Workflow fehl –
# dann bekommst du von GitHub eine E-Mail und weißt, dass du es wieder aktivieren musst (siehe README).

name: Supabase wach halten

on:
  schedule:
    - cron: '17 6 */3 * *' # alle 3 Tage um 06:17 UTC
  workflow_dispatch: # erlaubt manuelles Starten im Tab "Actions"

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anfragen
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Häufige Fehler beim Eintragen der Secrets zuerst prüfen, damit die Meldung klar ist
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Secret VITE_SUPABASE_URL oder VITE_SUPABASE_ANON_KEY ist leer (nicht unter Repository-Secrets gespeichert?)"
            exit 1
          fi
          if [[ "$URL" =~ [[:space:]] ]]; then
            echo "::error::VITE_SUPABASE_URL enthält ein Leerzeichen oder einen Zeilenumbruch – Secret neu eintragen"
            exit 1
          fi
          URL="${URL%/}" # Schrägstrich am Ende entfernen
          # Die URL ist nicht geheim (sie steckt auch in der App), daher darf der Anfang ins Log
          echo "URL: ${URL:0:30}… (Länge ${#URL})"

          # Die Anfrage erreicht die Datenbank. Dass sie als "nicht angemeldet" abgelehnt wird (401),
          # ist gewollt – deine Daten bleiben durch die RLS-Regeln geschützt.
          # "|| true": sonst bricht bash bei einem curl-Fehler ab, bevor wir den Grund ausgeben
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $KEY" \
            "$URL/rest/v1/subjects?select=id&limit=1") || true
          echo "Antwort von Supabase: $status"
          if [ "$status" = "000" ] || [ "$status" -ge 500 ]; then
            echo "::error::Supabase nicht erreichbar (Projekt pausiert?). Siehe README: 'Supabase-Projekt pausiert?'"
            exit 1
          fi
